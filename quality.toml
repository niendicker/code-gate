# Code Gate's own policy (dogfooding). Only gates backed by an implemented
# collector are enforced here.
[project]
name = "code-gate"
default_criticality = "B"

[collectors.clippy]
enabled = true

[collectors.llvm_cov]
enabled = true

[collectors.audit]
enabled = true

[[gates]]
id = "no-clippy-warnings"
metric = "code.clippy.warnings"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "no-clippy-errors"
metric = "code.clippy.errors"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "no-compiler-warnings"
metric = "code.compiler.warnings"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "no-compiler-errors"
metric = "code.compiler.errors"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "critical"
missing = "fail"

# Ratchet just below the measured baseline (76.6 % on 2026-09-27); raise it as
# coverage improves.
[[gates]]
id = "line-coverage"
metric = "test.coverage.lines"
scope = "project"
operator = "gte"
threshold = 75.0
severity = "error"
missing = "fail"

# `total` rather than `critical`: any known vulnerability in the lockfile,
# including unscored ones, blocks the gate.
[[gates]]
id = "no-vulnerable-dependencies"
metric = "security.vulnerabilities.total"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "critical"
missing = "fail"

[[gates]]
id = "no-unsound-dependencies"
metric = "dependency.unsound"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "no-yanked-dependencies"
metric = "dependency.yanked"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"
