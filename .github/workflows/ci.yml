name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  quality-gate:
    name: quality gate (dogfooding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit

      - run: cargo build --release -p code-gate-cli

      # Runs every collector enabled in quality.toml, then evaluates the gates.
      - run: ./target/release/code-gate collect
      - run: ./target/release/code-gate check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality.json
          if-no-files-found: ignore
