[project]
name = "example"
default_criticality = "B"

# Collectors run by `code-gate collect`. `clippy`, `llvm_cov` and `audit` are
# implemented; enabling a scaffolded collector makes `collect` fail explicitly.
[collectors.clippy]
enabled = true

# Requires cargo-llvm-cov (and llvm-tools-preview, or LLVM_COV/LLVM_PROFDATA).
[collectors.llvm_cov]
enabled = true

# Requires cargo-audit and network access to the RustSec advisory database.
[collectors.audit]
enabled = true

[collectors.bca]
enabled = false

[[gates]]
id = "no-clippy-warnings"
metric = "code.clippy.warnings"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "no-compiler-errors"
metric = "code.compiler.errors"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "line-coverage"
metric = "test.coverage.lines"
scope = "project"
operator = "gte"
threshold = 80.0
severity = "error"
missing = "fail"

[[gates]]
id = "critical-vulnerabilities"
metric = "security.vulnerabilities.critical"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "critical"
missing = "fail"

# Advisories without a CVSS vector are counted as `unknown`, not `critical`;
# gate on them too so they cannot slip through unscored.
[[gates]]
id = "unscored-vulnerabilities"
metric = "security.vulnerabilities.unknown"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"
