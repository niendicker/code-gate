[project]
name = "example"
default_criticality = "B"

# Collectors run by `code-gate collect`. Only Clippy is implemented so far;
# enabling a scaffolded collector makes `collect` fail explicitly.
[collectors.clippy]
enabled = true

[collectors.llvm_cov]
enabled = false

[collectors.audit]
enabled = false

[collectors.bca]
enabled = false

[[gates]]
id = "no-clippy-warnings"
metric = "code.clippy.warnings"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "no-compiler-errors"
metric = "code.compiler.errors"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "error"
missing = "fail"

[[gates]]
id = "line-coverage"
metric = "test.coverage.lines"
scope = "project"
operator = "gte"
threshold = 80.0
severity = "error"
missing = "fail"

[[gates]]
id = "critical-vulnerabilities"
metric = "security.vulnerabilities.critical"
scope = "project"
operator = "lte"
threshold = 0.0
severity = "critical"
missing = "fail"
